name: Build and deploy ExploreWorld Tours
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore packages
        run: nuget restore .\WebApplication20\WebApplication20.csproj -PackagesDirectory .\packages
      - name: Build and publish ASP.NET project
        run: >
          msbuild .\WebApplication20\WebApplication20.csproj
          /p:Configuration=Release
          /p:DeployOnBuild=true
          /p:WebPublishMethod=FileSystem
          /p:publishUrl="${{ github.workspace }}\publish"
          /p:DeleteExistingFiles=true
      - name: Deploy to MonsterASP.NET
        env:
          DEPLOY_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          & $msdeploy -verb:sync "-source:contentPath=$env:GITHUB_WORKSPACE\publish" "-dest:contentPath=${{ secrets.WEBSITE_NAME }},computerName=${{ secrets.SERVER_COMPUTER_NAME }},userName=${{ secrets.SERVER_USERNAME }},password=$env:DEPLOY_PASSWORD,authType=Basic" -enableRule:AppOffline -allowUntrusted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
